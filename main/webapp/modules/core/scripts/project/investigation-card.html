<div class="investigation-card" bind="cardDiv">
  <div class="investigation-card-header">
    <span class="investigation-card-title" bind="titleSpan"></span>
    <span class="investigation-card-range" bind="rangeSpan"></span>
    <button type="button" class="investigation-card-close" bind="closeButton">&times;</button>
  </div>
  <div class="investigation-card-body" bind="bodyDiv"></div>
</div>
