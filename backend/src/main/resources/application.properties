spring.application.name=saving-streak

# One SQLite file, no server and no Docker, so the app runs on a locked-down managed device.
# The path is relative to this module, and the file is created on first start.
spring.datasource.url=jdbc:sqlite:${SAVING_STREAK_DB:../data/saving-streak.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite serialises writers. A pool larger than one produces SQLITE_BUSY under concurrent writes.
spring.datasource.hikari.maximum-pool-size=1

# SQLite has no first-party Hibernate dialect.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Migrations are deferred for this slice; the schema is generated from the entity model.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Every error answers in one shape (RFC 9457), carrying its reason in "detail". A refusal is only
# useful if the person who caused it can read why, and the frontend shows that field unchanged.
spring.mvc.problemdetails.enabled=true
