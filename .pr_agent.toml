[config]
response_language = "en-US"
max_model_tokens = 32000
custom_model_max_tokens = 200000
output_run_details = true
enable_auto_approval = false

[openrouter]
max_tokens = 16000
reasoning_effort = "none"

[pr_description]
publish_description_as_comment = true
publish_description_as_comment_persistent = true
generate_ai_title = false
publish_labels = false
extra_instructions = "Explain the user-visible change simply. Preserve the author's PR description and distinguish implementation changes from documentation-only changes."

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_priority_files = true
inline_key_issues = true
num_max_findings = 5
enable_review_labels_security = false
enable_review_labels_effort = false
publish_error_details = true
extra_instructions = """
Review the proposed change as an independent critic. Use these lenses:

Alignment: Compare the implementation with the supplied specification, linked ticket,
acceptance criteria and project conventions. Flag ignored requirements, scope drift and
unsupported assumptions. Treat ambiguous product decisions as questions for clarification.
State which required context is missing instead of inventing requirements.

Reliability: Trace changed behaviour across its entry point, business rules, state and
user-visible result. Prioritize concrete bugs, regressions, security risks and data loss.
Inspect relevant boundaries, retries, duplicate processing and partial failures.

Tests: Map changed behaviour and acceptance criteria to the supplied tests. Check that
assertions exercise the real rule and would detect a meaningful mistake. Look for tests
that only assert stubbed responses, weakened expectations and uncovered edge cases.
For bug fixes, assess whether regression coverage would catch the original failure.

Architecture: Assess cohesion, encapsulation, coupling and interface clarity in the
changed code. Identify duplicated decisions, leaked internals or unnecessary abstractions
only when you can explain their effect on correctness, testing or future changes.
Keep findings focused on the proposed change and its affected callers.

Evidence and handoff: Group related findings by behaviour so a human can follow the
change across files. For each finding, provide the triggering scenario, affected code,
observable impact and supporting evidence. Separate confirmed defects from assumptions
and unresolved decisions. Prioritize access controls and irreversible actions.
Record review limits, including unavailable context, excluded files and untested states.
For UI changes, identify journeys needing browser verification and assess supplied evidence.
Claim tests or browser checks ran only when their results are supplied for this revision.
A successful review job establishes that the job ran. Human acceptance still depends on
assessed findings and current verification evidence.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
extra_instructions = "Focus on actionable correctness fixes. Avoid stylistic rewrites and unrelated refactors."
