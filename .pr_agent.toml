[config]
response_language = "en-US"
max_model_tokens = 32000
custom_model_max_tokens = 200000
output_run_details = true
enable_auto_approval = false

[openrouter]
max_tokens = 16000
reasoning_effort = "none"

[pr_description]
publish_description_as_comment = true
publish_description_as_comment_persistent = true
generate_ai_title = false
publish_labels = false
extra_instructions = "Explain the user-visible change simply. Preserve the author's PR description and distinguish implementation changes from documentation-only changes."

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_priority_files = true
inline_key_issues = true
num_max_findings = 5
enable_review_labels_security = false
enable_review_labels_effort = false
publish_error_details = true
extra_instructions = """
Review Saving Streak, a Java 17 / Spring Boot backend with a React / TypeScript frontend.
Prioritize concrete bugs, regressions, missing behavioral tests and meaningful security issues.
For each finding, identify the triggering scenario and explain its observable impact.
Check points arithmetic and rounding, retry/idempotency behavior, and use of the application's
injected clock where relevant. Bonus points must not accidentally move euros or advance a streak.
Frontend API calls must use the existing apiUrl helper so deployment behind a path prefix works.
Use the linked ticket or acceptance criteria when available; do not invent missing requirements.
Avoid cosmetic feedback. Clearly distinguish observed evidence from assumptions, and never claim
to have run tests or inspected a browser unless that evidence is actually supplied.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
extra_instructions = "Focus on actionable correctness fixes. Avoid stylistic rewrites and unrelated refactors."
